name: Daily IREDA Cockpit Update

on:
  schedule:
    # 08:23 AM IST (Mon-Fri) — Pre-open overnight US / Brent / Gold / FX check
    - cron: '53 2 * * 1-5'
    # 09:37 AM IST (Mon-Fri) — Post-NSE open live check
    - cron: '7 4 * * 1-5'
    # 12:07 PM IST (Mon-Fri) — Mid-session live check
    - cron: '37 6 * * 1-5'
    # 02:37 PM IST (Mon-Fri) — Pre-close exit-decision window
    - cron: '7 9 * * 1-5'
    # 04:07 PM IST (Mon-Fri) — Post-NSE official close + closing-basis prediction grading
    - cron: '37 10 * * 1-5'
    # 06:13 PM IST (Sunday) — Weekly candle & trendline reset
    - cron: '43 12 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-cockpit-update
  cancel-in-progress: false

jobs:
  update-cockpit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run daily market update and auto-grade predictions
        run: python3 scripts/daily_update.py

      - name: Run Nifty 50 & IREDA Demand/Supply swing scanner
        run: python3 scripts/demand_supply_scanner.py

      - name: Commit and push updated cockpit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cockpit_state.json daily_ledger.jsonl daily_history.jsonl demand_supply_state.json swing_ledger.jsonl
          if git diff --staged --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          TS=$(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M IST')
          git commit -m "chore(cockpit): auto-update macro lights & ledger (${TS})"
          git pull --rebase origin main
          git push origin main
